# Docker Compose — ChatLoop (WhatsApp AI Assistant)
# Usage:
#   1. Salin .env.example → .env dan isi value yang sesuai
#      (DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME → arahkan ke MySQL yang sudah ada)
#   2. docker compose up -d --build
#   3. Akses di http://localhost:3030

services:
  # ────────────────────────────────────────────────────────────
  # ChatLoop App (Go backend + React frontend)
  # ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatloop-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GIN_MODE: release
      STATIC_DIR: frontend/dist
      DB_PATH: /app/data/wa-assistant.db
      PORT: "3030"
    ports:
      - "3030:3030"
    volumes:
      - chatloop-wa-data:/app/data   # WhatsApp session & SQLite data
    networks:
      - chatloop-net

# ────────────────────────────────────────────────────────────
# Persistent volumes
# ────────────────────────────────────────────────────────────
volumes:
  chatloop-wa-data:
    driver: local

# ────────────────────────────────────────────────────────────
# Internal network
# ────────────────────────────────────────────────────────────
networks:
  chatloop-net:
    driver: bridge
